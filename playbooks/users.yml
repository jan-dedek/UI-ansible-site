---
- name: Manage my user and its SSH keys
  hosts: bifur
  become: true
  tasks:
    - name: Ensure my user exists
      ansible.builtin.user:
        name: "{{ admin_user_name }}"
        state: present
        create_home: true
        update_password: on_create

    - name: Set authorized SSH keys (remove the ones not listed)
      ansible.posix.authorized_key:
        user: "{{ admin_user_name }}"
        key: "{{ admin_user_ssh_keys | join('\n') }}"
        state: present
        exclusive: true